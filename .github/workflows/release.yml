name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要创建或更新的 Release 标签，例如 v0.1.22"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 同步发布版本
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node scripts/sync-release-version.mjs $env:RELEASE_TAG
          $releaseVersion = $env:RELEASE_TAG -replace '^v', ''
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: 安装前端依赖
        run: npm ci

      - name: 检查前端
        run: npm run check

      - name: 运行 Rust 测试
        working-directory: src-tauri
        run: cargo test

      - name: 仅构建 Windows NSIS 安装程序与免安装独立程序
        run: npm run tauri -- build --bundles nsis

      - name: 压缩免安装便携版
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/coding-tools-mcp-desktop.exe -DestinationPath "src-tauri/target/release/Coding.Tools.MCP_${env:RELEASE_VERSION}_x64-portable.zip"

      - name: 上传 Windows 产物
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/Coding.Tools.MCP_*_x64-portable.zip
          if-no-files-found: error

  build-universal-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 同步发布版本
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node scripts/sync-release-version.mjs "$RELEASE_TAG"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: 安装前端依赖
        run: npm ci

      - name: 检查前端
        run: npm run check

      - name: 运行 Rust 测试
        working-directory: src-tauri
        run: cargo test

      - name: 仅构建通用版 macOS DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg

      - name: 上传 macOS DMG
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: browser-extension/chatgpt-turn-observer/package-lock.json

      - name: 同步发布版本
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          node scripts/sync-release-version.mjs "$RELEASE_TAG"
          echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: 安装浏览器扩展依赖
        working-directory: browser-extension/chatgpt-turn-observer
        run: npm ci

      - name: 运行扩展测试与类型检查
        working-directory: browser-extension/chatgpt-turn-observer
        run: |
          npm test
          npm run typecheck

      - name: 构建浏览器扩展
        working-directory: browser-extension/chatgpt-turn-observer
        run: npm run build

      - name: 打包浏览器扩展 ZIP
        run: |
          cd browser-extension/chatgpt-turn-observer/dist
          zip -r "../../../chatgpt-turn-observer-${RELEASE_VERSION}.zip" .

      - name: 上传浏览器扩展 ZIP

      - name: 上传浏览器扩展 ZIP
        uses: actions/upload-artifact@v6
        with:
          name: browser-extension-zip
          path: chatgpt-turn-observer-*.zip
          if-no-files-found: error

  publish-release:
    needs:
      - build-windows
      - build-universal-macos
      - build-browser-extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: 下载 Windows 产物
        uses: actions/download-artifact@v7
        with:
          name: windows-exe
          path: dist/windows

      - name: 下载 macOS DMG
        uses: actions/download-artifact@v7
        with:
          name: macos-dmg
          path: dist/macos

      - name: 下载浏览器扩展 ZIP
        uses: actions/download-artifact@v7
        with:
          name: browser-extension-zip
          path: dist/extension

      - name: 整理发布资产文件
        run: |
          mkdir -p release_assets
          find dist -type f \( -name "*.exe" -o -name "*.zip" -o -name "*.dmg" \) -exec cp {} release_assets/ \;
          echo "=== 待发布的资产列表 ==="
          ls -la release_assets/

      - name: 发布或更新 Release 并上传安装包与浏览器扩展
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG 已存在，正在覆盖上传最新构建产物..."
            gh release upload "$RELEASE_TAG" release_assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            echo "Release $RELEASE_TAG 不存在，正在创建 Release 并上传产物..."
            gh release create "$RELEASE_TAG" release_assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Coding Tools MCP $RELEASE_TAG" \
              --generate-notes
          fi
